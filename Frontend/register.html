
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | QuizVerse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">quizverse<span>.</span></a>
        <a href="index.html" class="nav-link">← Back to home</a>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <p class="section-label">GET STARTED</p>
            <h1>Create your account<span>.</span></h1>
            <p class="auth-description">Join QuizVerse and put your knowledge to the test.</p>

            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input type="text" id="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" minlength="8" required>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" id="confirmPassword" placeholder="Enter password again" minlength="8" required>
                </div>

                <button type="submit" class="btn btn-primary auth-button">
                    Create account →
                </button>
            </form>

            <p class="auth-switch">
                Already have an account? <a href="login.html">Log in</a>
            </p>
        </div>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
